name: CI

on:
  push:
    branches: ['main', 'feat/**', 'fix/**', 'arena/**']
  pull_request:
    branches: ['main']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: truco_test
          POSTGRES_PASSWORD: truco_test_password
          POSTGRES_DB: truco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U truco_test -d truco_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      NODE_ENV: test
      APP_NAME: 'Mesa de Truco'
      DATABASE_URL: postgresql://truco_test:truco_test_password@localhost:5432/truco_test
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci_test_session_secret_at_least_32_characters_long
      SEED_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      REFRESH_TOKEN_TTL: '2592000'
      COOKIE_DOMAIN: localhost
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      EMAIL_PROVIDER: console
      CAPTCHA_PROVIDER: disabled
      TURN_TIMEOUT_MS: '30000'
      RECONNECT_GRACE_MS: '45000'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies (high/critical)
        run: pnpm audit --prod --audit-level=high

      - name: Check formatting
        run: pnpm format:check

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript strict typecheck
        run: pnpm typecheck

      - name: Run automated tests
        run: pnpm test

      - name: Build all packages and applications
        run: pnpm build

      - name: Validate docker-compose configuration
        run: docker compose config -q
