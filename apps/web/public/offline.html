<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F3D2E" />
    <title>Sin conexión · Mesa de Truco</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: radial-gradient(circle at 50% 35%, #0f3d2e 0%, #09281e 100%);
        color: #f4efe6;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      main {
        max-width: 30rem;
        width: 100%;
        background: #14201b;
        border: 2px solid rgba(224, 184, 76, 0.45);
        border-radius: 20px;
        padding: 1.75rem;
        box-shadow: 0 20px 48px rgba(0, 0, 0, 0.45);
      }
      .badge {
        display: inline-block;
        padding: 0.25rem 0.7rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 700;
        color: #e0b84c;
        border: 1px solid #e0b84c;
        margin-bottom: 0.9rem;
      }
      h1 {
        margin: 0 0 0.65rem;
        font-family: Georgia, serif;
        font-size: 1.65rem;
        line-height: 1.2;
      }
      p {
        margin: 0 0 1.25rem;
        color: #c9c2b4;
        line-height: 1.55;
        font-size: 0.95rem;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
      }
      a,
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0.65rem 1rem;
        border-radius: 12px;
        font-weight: 700;
        font-size: 0.92rem;
        text-decoration: none;
        cursor: pointer;
      }
      .primary {
        background: #e0b84c;
        color: #14201b;
        border: none;
      }
      .secondary {
        background: #1b2b24;
        color: #f4efe6;
        border: 1px solid rgba(244, 239, 230, 0.28);
      }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">Modo sin conexión</span>
      <h1>Te quedaste sin señal en el paño</h1>
      <p>
        No pudimos conectar con el servidor para jugar mesas multijugador en vivo, pero el
        <strong>Anotador de fósforos</strong> y la guía de reglas y señas siguen disponibles en tu
        dispositivo.
      </p>
      <div class="actions">
        <a class="primary" href="/anotador">Abrir anotador de fósforos</a>
        <a class="secondary" href="/aprender">Repasar reglas y señas</a>
        <button class="secondary" type="button" onclick="window.location.reload()">
          Reintentar conexión
        </button>
      </div>
    </main>
  </body>
</html>
