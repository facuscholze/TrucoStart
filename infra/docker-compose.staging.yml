name: mesa-de-truco-staging

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - staging_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    restart: always
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '${API_PORT:-3001}:3001'

  game-server:
    build:
      context: ..
      dockerfile: infra/docker/game-server.Dockerfile
    restart: always
    env_file:
      - ../.env
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - '${GAME_SERVER_PORT:-3002}:3002'

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    restart: always
    ports:
      - '${WEB_PORT:-5173}:8080'

  admin:
    build:
      context: ..
      dockerfile: infra/docker/admin.Dockerfile
    restart: always
    ports:
      - '${ADMIN_PORT:-5174}:8080'

volumes:
  staging_postgres_data:
  staging_redis_data:
