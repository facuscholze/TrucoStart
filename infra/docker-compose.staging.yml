# docker-compose de staging (M8c).
#
# Servicios:
#   - postgres, redis: BBDD y pub/sub (en prod se reemplazan por Neon/Upstash o
#     un servicio gestionado).
#   - api, game-server: procesos Node de la app.
#   - web, admin: SPAs servidas por nginx.
#   - migrate: job efímero que corre las migraciones Drizzle y sale (exit 0 si
#     están al día; exit !=0 en caso de deriva y detiene el deploy vía
#     `service_completed_successfully`).
#   - caddy: terminador TLS y reverse proxy perimetral. Es el ÚNICO servicio con
#     puertos publicados en el host (80/443). Ningún upstream expone puertos:
#     se llega a ellos sólo por la red interna `truco-net`.
#
# Firewall: Docker publica puertos insertando reglas DNAT en `iptables` ANTES que
# ufw, así que `ufw deny 443` no alcanza. El compose se acompaña de
# `infra/firewall/docker-user-cloudflare.sh`, que limita 80/443 a los rangos de
# Cloudflare en la cadena `DOCKER-USER`. Ver `docs/DEPLOY.md#firewall`.
name: mesa-de-truco-staging

networks:
  truco-net:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [truco-net]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [truco-net]
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - staging_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    networks: [truco-net]
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    # Corre las migraciones Drizzle pendientes (lee DATABASE_URL del entorno).
    command: ['node', 'dist/db/migrate.js']
    restart: 'no'

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    networks: [truco-net]
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      API_HOST: '0.0.0.0'
      GAME_SERVER_INTERNAL_URL: http://game-server:3002
      # Sólo Caddy llega a la API. Con TRUSTED_PROXY_HEADER=x-forwarded-for y
      # sin CF-Connecting-IP aquí, la IP real la resuelve Caddy (ADR-020/022).
      TRUSTED_PROXY_CIDRS: '172.16.0.0/12'
      TRUSTED_PROXY_HEADER: 'x-forwarded-for'
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/v1/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  game-server:
    build:
      context: ..
      dockerfile: infra/docker/game-server.Dockerfile
    restart: unless-stopped
    networks: [truco-net]
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379
      GAME_SERVER_HOST: '0.0.0.0'
      API_INTERNAL_URL: http://api:3001
      TRUSTED_PROXY_CIDRS: '172.16.0.0/12'
      TRUSTED_PROXY_HEADER: 'x-forwarded-for'
      NODE_ENV: production
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3002/ready']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 45s

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: ${WEB_VITE_API_BASE_URL:-https://api.staging.truco.ar}
        VITE_GAME_SERVER_URL: ${WEB_VITE_GAME_SERVER_URL:-wss://api.staging.truco.ar}
        VITE_CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
    restart: unless-stopped
    networks: [truco-net]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/healthz.txt']
      interval: 15s
      timeout: 3s
      retries: 3

  admin:
    build:
      context: ..
      dockerfile: infra/docker/admin.Dockerfile
      args:
        VITE_API_BASE_URL: ${WEB_VITE_API_BASE_URL:-https://api.staging.truco.ar}
        VITE_CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
    restart: unless-stopped
    networks: [truco-net]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/healthz.txt']
      interval: 15s
      timeout: 3s
      retries: 3

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    networks: [truco-net]
    # Único servicio con puertos publicados. 80 queda abierto para la validación
    # HTTP-01 de ACME y para redirigir a HTTPS. Los puertos del host son
    # configurables sólo para el smoke test de CI (que corre sin root); en el VPS
    # se usan los defaults 80/443.
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-staging.truco.ar}
      ACME_EMAIL: ${ACME_EMAIL:-ops@truco.ar}
      # Caddy sólo acepta CF-Connecting-IP si el par TCP es un edge de Cloudflare.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - staging_caddy_data:/data
      - staging_caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      game-server:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'caddy', 'validate', '--config', '/etc/caddy/Caddyfile']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  staging_postgres_data:
  staging_redis_data:
  staging_caddy_data:
  staging_caddy_config:
