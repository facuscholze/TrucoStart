# Scrape de la API (M8a). El game-server no se scrapea directo: sus métricas se
# re-publican en /v1/metrics (protegido con METRICS_TOKEN).
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: truco-api
    metrics_path: /v1/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ['api:3001']
        labels:
          env: staging
